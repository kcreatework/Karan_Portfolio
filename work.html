<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work — Karan Panda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body id="top">

<header class="nav" id="site-nav"></header>

<main>
  <div class="wrap page-top-grid">
    <div class="carousel-wrap">
      <div class="carousel-outer"><div class="carousel-track" id="carousel-strip"></div></div>
      <button class="carousel-nav prev" id="carousel-prev" aria-label="Scroll carousel left">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button class="carousel-nav next" id="carousel-next" aria-label="Scroll carousel right">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>
  </div>

  <div class="filter-bar">
    <div class="filter-pills" id="filter-pills"></div>
  </div>
  <div class="filter-count" id="filter-count"></div>

  <section class="wrap">
    <div class="project-grid" id="project-grid"></div>
  </section>
</main>

<footer class="footer" id="site-footer"></footer>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/work.js"></script>
</body>
</html>
